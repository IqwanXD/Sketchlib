plugins {
	id 'com.android.application'
}

android {
	compileSdk 33
	
	defaultConfig {
		applicationId "ru.iqwanoino.sketchlib"
		namespace "ru.iqwanoino.sketchlib"
		minSdkVersion 21
		targetSdkVersion 28
		versionCode 4561
		versionName "0.21"
	}
	
	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}
}

dependencies {
	implementation fileTree(dir: 'libs', include: ['*.jar'])
}
